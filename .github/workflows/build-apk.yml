name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore protected signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.STREAMER_REMOTE_DEBUG_KEYSTORE_B64 }}
          STREAMER_REMOTE_SIGNING_FILE: ${{ github.workspace }}/signing.p12
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "Repository secret STREAMER_REMOTE_DEBUG_KEYSTORE_B64 is required" >&2
            exit 1
          fi
          printf %s "$SIGNING_KEY_B64" | base64 --decode > "$STREAMER_REMOTE_SIGNING_FILE"
          chmod 600 "$STREAMER_REMOTE_SIGNING_FILE"
      - name: Build APK
        env:
          STREAMER_REMOTE_SIGNING_FILE: ${{ github.workspace }}/signing.p12
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: streamer-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
